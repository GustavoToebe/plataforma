name: Java

# Testa em todo push e pull request. Publica no GitHub Packages quando se cria uma tag `vX.Y.Z` (a versão do pom raiz precisa ser igual).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testes
        run: mvn -B verify
      - name: Publicar (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSAO_TAG="${GITHUB_REF_NAME#v}"
          VERSAO_POM="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$VERSAO_TAG" != "$VERSAO_POM" ]; then echo "Tag $VERSAO_TAG diferente da versão do pom $VERSAO_POM"; exit 1; fi
          mkdir -p ~/.m2
          printf '<settings><servers><server><id>github</id><username>%s</username><password>%s</password></server></servers></settings>' "$GITHUB_ACTOR" "$GITHUB_TOKEN" > ~/.m2/settings.xml
          # deployAtEnd: se um módulo falhar, nenhum é publicado (versão publicada não se altera).
          mvn -B -DskipTests -DdeployAtEnd=true deploy
